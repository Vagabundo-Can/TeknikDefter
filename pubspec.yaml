name: teknik_defter
description: "Teknik Defter — mühendislik ve motosiklet eğitimi için kalem odaklı not uygulaması (Vagabundo Apps)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  uuid: ^4.4.0
  http: ^1.2.1
  url_launcher: ^6.3.0
  # Google hesabı + Drive senkron
  google_sign_in: ^6.2.1            # Android
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  googleapis_auth: ^1.6.0           # Windows (loopback OAuth)
  googleapis: ">=12.0.0 <16.0.0"    # Drive v3
  # El yazısı tanıma (Android, cihaz üstü)
  google_mlkit_digital_ink_recognition: ">=0.11.0 <1.0.0"
  # Aşama 2: PDF, görsel, ses, paylaşım
  pdf: ^3.11.0                      # PDF üretimi (dışa aktarma)
  pdfrx: ^3.0.0                     # PDF sayfalarını görüntüye çevirme (içe aktarma)
  file_picker: ">=8.0.0 <11.0.0"
  image_picker: ^1.1.2
  share_plus: ^10.1.0
  record: ^7.0.0
  audioplayers: ^6.1.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon_full.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
