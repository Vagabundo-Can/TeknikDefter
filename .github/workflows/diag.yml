name: diag-android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform klasörleri
        run: |
          flutter create --platforms=android,windows --org com.vagabundo --project-name teknik_defter .
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          grep -q android.permission.INTERNET $M || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' $M
      - run: flutter build apk --release
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          disable-animations: true
          script: bash tool/emu_check.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Sonuçları diag dalına gönder
        if: always()
        run: |
          mkdir -p diag && cp android/app/src/main/AndroidManifest.xml diag/ || true
          cp android/app/build.gradle* diag/ 2>/dev/null || true
          cd diag
          git init -q -b diag
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "diag ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" diag
    permissions:
      contents: write

  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Ekran görüntüleri
        run: SCREENSHOTS=1 flutter test test/screenshots_test.dart
      - name: screens dalına gönder
        if: always()
        run: |
          mkdir -p screenshots && cd screenshots
          git init -q -b screens
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "screens ${GITHUB_SHA::7}" --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screens
