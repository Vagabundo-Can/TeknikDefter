name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  test-android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Platform klasörlerini oluştur (yoksa)
        run: |
          flutter create --platforms=android,windows --org com.vagabundo --project-name teknik_defter .
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          grep -q android.permission.INTERNET $M || sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' $M
          sed -i 's#android:label="teknik_defter"#android:label="Teknik Defter"#' $M

      - name: Sabit debug anahtarı (Google girişi için SHA-1 sabit kalsın)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: teknik-defter-android
          path: build/app/outputs/flutter-apk/app-release.apk

  publish:
    # Derlenen dosyaları "builds" dalına koyar (git ile indirilebilsin)
    if: github.ref == 'refs/heads/main'
    needs: [test-android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: builds dalına gönder
        run: |
          mkdir out && cd out
          cp ../art/teknik-defter-android/app-release.apk TeknikDefter-Android.apk
          cp ../art/teknik-defter-windows/* .
          echo "commit ${GITHUB_SHA} · $(date -u +%Y-%m-%dT%H:%MZ)" > SURUM.txt
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "Derleme ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Platform klasörleri
        shell: bash
        run: |
          flutter create --platforms=android,windows --org com.vagabundo --project-name teknik_defter .
          rm -f test/widget_test.dart
          sed -i 's/L"teknik_defter"/L"Teknik Defter"/' windows/runner/main.cpp
      - run: flutter pub get
      - name: Windows derle
        run: >
          flutter build windows --release
          --dart-define=GOOGLE_DESKTOP_CLIENT_ID=${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
      - name: Paketle (taşınabilir zip + kurulum)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/TeknikDefter-Windows-tasinabilir.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer/teknik_defter.iss
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: teknik-defter-windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            teknik-defter-android/app-release.apk
            teknik-defter-windows/*
