name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  test-android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Platform klasörlerini oluştur (yoksa)
        run: |
          flutter create --platforms=android,windows --org com.vagabundo --project-name teknik_defter .
          rm -f test/widget_test.dart

      - name: Sabit debug anahtarı (Google girişi için SHA-1 sabit kalsın)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | tr -d " \r\n\t" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep SHA1

      - run: flutter pub get
      - name: Uygulama simgesi
        run: dart run flutter_launcher_icons
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: teknik-defter-android
          path: build/app/outputs/flutter-apk/app-release.apk

  publish:
    # Derlenen dosyaları "builds" dalına koyar (git ile indirilebilsin)
    if: github.ref == 'refs/heads/main'
    needs: [test-android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: builds dalına gönder
        run: |
          mkdir out && cd out
          cp ../art/teknik-defter-android/app-release.apk TeknikDefter-Android.apk
          cp ../art/teknik-defter-windows/* .
          echo "commit ${GITHUB_SHA} · $(date -u +%Y-%m-%dT%H:%MZ)" > SURUM.txt
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A && git commit -qm "Derleme ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Platform klasörleri
        shell: bash
        run: |
          flutter create --platforms=android,windows --org com.vagabundo --project-name teknik_defter .
          rm -f test/widget_test.dart
          sed -i 's/L"teknik_defter"/L"Teknik Defter"/' windows/runner/main.cpp
          python tool/patch_windows.py
      - run: flutter pub get
      - name: Uygulama simgesi
        run: dart run flutter_launcher_icons
      - name: Windows derle
        shell: pwsh
        env:
          RAW_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          RAW_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          # Yapıştırılan metinden geçerli kısmı ayıkla (etiket/boşluk/JSON olsa da)
          $all = "$env:RAW_ID $env:RAW_SECRET"
          $id = [regex]::Match($all, '[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com').Value
          $sec = [regex]::Match($all, 'GOCSPX-[A-Za-z0-9_\-]+').Value
          Write-Host "Client ID bulundu: $([bool]$id) · Secret bulundu: $([bool]$sec)"
          # Değer göstermeden biçim: harf→a, BÜYÜK→A, rakam→9
          function Shape($v) { if (-not $v) { return "<boş>" }; ($v -creplace '[a-z]','a' -creplace '[A-Z]','A' -creplace '[0-9]','9') + " (uzunluk $($v.Length))" }
          Write-Host "ID biçimi: $(Shape $env:RAW_ID)"
          Write-Host "Secret biçimi: $(Shape $env:RAW_SECRET)"
          flutter build windows --release "--dart-define=GOOGLE_DESKTOP_CLIENT_ID=$id" "--dart-define=GOOGLE_DESKTOP_CLIENT_SECRET=$sec"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Paketle (taşınabilir zip + kurulum)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/TeknikDefter-Windows-tasinabilir.zip
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer/teknik_defter.iss
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: teknik-defter-windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            teknik-defter-android/app-release.apk
            teknik-defter-windows/*
